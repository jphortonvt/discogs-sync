[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discogs-sync"
version = "0.1.0"
description = "Sync your Discogs collection to streaming services"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "python3-discogs-client>=2.7",
    "ytmusicapi>=1.7",
    "keyring>=24",
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13",
    "tomli-w>=1.0",
    "rapidfuzz>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-vcr>=1",
    "vcrpy>=6",
    "ruff>=0.4",
]

[project.scripts]
discogs-sync = "discogs_sync.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/discogs_sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
